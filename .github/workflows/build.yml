# Tests Zwanki, then builds the app for macOS (Apple Silicon + Intel), Windows and Linux.
# Every run uploads the builds as workflow artifacts.
#
# To publish a release: Actions -> Build -> "Run workflow", enter a version such as 0.2.0.
# (Pushing a tag like v0.2.0 does the same.) The pipeline tags the commit, stamps the version
# into the apps, and publishes them with checksums as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. 0.2.0 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.release }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v="$REF_NAME"; else v="$REQUESTED"; fi
          v="${v#v}"
          if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' isn't a version like 1.2.3"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          echo "${v:+Releasing v$v}${v:-Build only, no release}"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            artifact: zwanki-macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            artifact: zwanki-macos-x86_64
          - name: Windows
            os: windows-latest
            artifact: zwanki-windows-x64
          - name: Linux
            os: ubuntu-22.04  # older glibc, so the binary runs on more distributions
            artifact: zwanki-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Stamp release version
        if: needs.version.outputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: python scripts/set_version.py "$VERSION"

      - name: Build
        run: |
          python scripts/make_icons.py
          pyinstaller --noconfirm zwanki.spec

      # --self-test imports the parts that are only loaded at runtime, to catch anything PyInstaller
      # left out; the MCP smoke test talks to the built binary the way Claude does.
      - name: Smoke test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/Zwanki.app/Contents/MacOS/Zwanki --self-test
          python scripts/smoke_test_mcp.py dist/Zwanki.app/Contents/MacOS/Zwanki --mcp
          ditto -c -k --keepParent dist/Zwanki.app "${{ matrix.artifact }}.zip"

      - name: Smoke test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed exe doesn't block the shell, so wait for it explicitly.
          $test = Start-Process -FilePath dist/zwanki/zwanki.exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw "self-test failed with exit code $($test.ExitCode)" }
          python scripts/smoke_test_mcp.py dist/zwanki/zwanki-mcp.exe --mcp
          if ($LASTEXITCODE -ne 0) { throw "MCP smoke test failed" }
          Compress-Archive -Path dist/zwanki -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Smoke test and package (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/zwanki --self-test
          python scripts/smoke_test_mcp.py dist/zwanki --mcp
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist zwanki

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          cat > notes.md <<EOF
          ## Downloads

          | System | File |
          |---|---|
          | macOS, Apple Silicon (M1 and newer) | [zwanki-macos-arm64.zip]($download/zwanki-macos-arm64.zip) |
          | macOS, Intel | [zwanki-macos-x86_64.zip]($download/zwanki-macos-x86_64.zip) |
          | Windows 10/11 (64-bit) | [zwanki-windows-x64.zip]($download/zwanki-windows-x64.zip) |
          | Linux (x86_64) | [zwanki-linux-x86_64.tar.gz]($download/zwanki-linux-x86_64.tar.gz) |

          - **macOS:** unzip, move Zwanki to Applications and open it. The app isn't signed with an Apple developer account, so the first time, macOS blocks it: open System Settings → Privacy & Security and click **Open Anyway**. Allow Bluetooth when asked. Zwanki lives in the menu bar.
          - **Windows:** unzip and run \`zwanki.exe\` in the \`zwanki\` folder; if SmartScreen warns, click **More info → Run anyway**.
          - **Linux:** extract and run \`./zwanki\` (needs BlueZ).

          You also need Anki with the [AnkiConnect](https://ankiweb.net/shared/info/2055492159) add-on. See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for setup, the trainer, and the weekly review with Claude. Checksums are in \`SHA256SUMS.txt\`.

          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Zwanki $TAG" --notes-file notes.md --generate-notes $prerelease
